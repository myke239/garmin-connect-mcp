[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "garmin-connect-mcp"
version = "0.1.0"
description = "Local read-only Garmin Connect tools for MCP clients"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp==1.30.0", "garminconnect==0.3.17", "curl_cffi==0.16.3", "pywin32>=310; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
garmin-connect-mcp = "garmin_connect_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_connect_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

