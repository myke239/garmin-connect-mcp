[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "garmin-connect-mcp"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
description = "Local read-only Garmin Connect tools for MCP clients"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp==1.30.0", "garminconnect==0.3.17", "curl_cffi==0.16.3", "truststore==0.10.4", "pywin32>=310; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
remote = ["ngrok==1.7.0", "uvicorn==0.54.0"]

[project.scripts]
garmin-connect-mcp = "garmin_connect_mcp.cli:main"

[project.urls]
Repository = "https://github.com/myke239/garmin-connect-mcp"
Issues = "https://github.com/myke239/garmin-connect-mcp/issues"
Changelog = "https://github.com/myke239/garmin-connect-mcp/blob/main/CHANGELOG"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_connect_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

