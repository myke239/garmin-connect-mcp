[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "garmin-connect-mcp"
version = "0.15.0"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
description = "Garmin Connect MCP tools with default-enabled previewed account writes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp==1.30.0", "garminconnect==0.3.17", "garmin-fit-sdk==21.218.0", "curl_cffi==0.16.3", "truststore==0.10.4", "defusedxml==0.7.1", "jsonschema==4.26.0", "tzdata==2026.5", "pywin32>=310; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "keyring==25.7.0", "cryptography==50.0.2", "ruff==0.17.0", "mypy==2.4.0", "build==1.6.1", "pip-audit==2.10.1"]
desktop = ["pystray==0.19.5", "pillow==12.3.0"]
package = ["pyinstaller==6.22.3"]
secure = ["keyring==25.7.0", "cryptography==50.0.2"]
remote = ["ngrok==1.7.0", "uvicorn==0.54.0"]

[project.scripts]
garmin-connect-mcp = "garmin_connect_mcp.cli:main"

[project.urls]
Documentation = "https://github.com/myke239/garmin-connect-mcp/blob/main/docs/README.md"
Repository = "https://github.com/myke239/garmin-connect-mcp"
Issues = "https://github.com/myke239/garmin-connect-mcp/issues"
Changelog = "https://github.com/myke239/garmin-connect-mcp/blob/main/CHANGELOG"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_connect_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=work/pytest-tmp"
