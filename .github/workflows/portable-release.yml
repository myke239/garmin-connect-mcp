name: Portable release
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI run for this exact main commit
        required: true
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require main and successful exact-commit CI
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > /tmp/ci.json
          python - <<'PY'
          import json, os
          run=json.load(open('/tmp/ci.json'))
          assert run['head_sha']==os.environ['GITHUB_SHA']
          assert run['head_branch']=='main' and run['conclusion']=='success'
          assert run['path']=='.github/workflows/tests.yml'
          PY
  build:
    needs: gate
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/work/pyinstaller-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev,remote,secure,desktop,package]'
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb python3-tk
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m PyInstaller --noconfirm --distpath dist/frozen --workpath work/frozen scripts/garmin-connect.spec
      - if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --distpath dist/frozen --workpath work/frozen scripts/garmin-connect.spec
      - name: Verify CLI, MCP and desktop
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          exe=pathlib.Path('dist/frozen/garmin-connect') / ('garmin-connect.exe' if os.name=='nt' else 'garmin-connect')
          subprocess.run([sys.executable,'scripts/verify_frozen.py',str(exe.resolve())],check=True,timeout=90)
          cmd=[str(exe.resolve()),'desktop','--smoke-test']
          subprocess.run(cmd if os.name=='nt' else ['xvfb-run','-a',*cmd],check=True,timeout=30)
      - run: python scripts/package_portable.py dist/frozen/garmin-connect dist/release --platform ${{ matrix.platform }}
      - name: Build and verify Windows setup executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/setup_inno.ps1
          ./scripts/build_windows_installer.ps1 -Bundle dist/frozen/garmin-connect -Compiler $env:DAS_KREB_INNO -UnsignedRelease
          $v = (Get-Content VERSION -Raw).Trim()
          ./scripts/verify_windows_installer.ps1 -Installer "dist/installer/garmin-connect-mcp-$v-windows-x64-setup.exe"
          Copy-Item "dist/installer/garmin-connect-mcp-$v-windows-x64-setup.exe" dist/release/GarminConnectSetup.exe
          python scripts/executable_checksums.py --output "dist/release/garmin-connect-mcp-$v-windows-x64-executable-SHA256SUMS" dist/frozen/garmin-connect dist/release/GarminConnectSetup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Installer checksum verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: dist/release
          merge-multiple: true
      - name: Publish verified unsigned portable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist/release
          sha256sum * > SHA256SUMS
          cd ../..
          python - <<'PY'
          from pathlib import Path
          notes=Path('docs/development/portable-release-notes.md').read_text(encoding='utf-8')
          sums=''.join(p.read_text(encoding='utf-8') for p in sorted(Path('dist/release').glob('*-executable-SHA256SUMS')))
          assert sums.strip(), 'Missing executable checksums'
          Path('dist/release-notes.md').write_text(notes+'\n\n## Executable SHA256 checksums\n\nCompare extracted executables with the matching platform checksum file. Archive hashes remain in SHA256SUMS.\n\n```text\n'+sums+'```\n',encoding='utf-8')
          PY
          v=$(cat VERSION)
          gh release create "v$v" dist/release/* --target "$GITHUB_SHA" --title "Garmin Connect MCP $v" --notes-file dist/release-notes.md
