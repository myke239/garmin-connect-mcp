name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade 'pip>=26.2.1'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
  installation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and exercise installed launcher and MCP
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "Garmin install with spaces"
          subprocess.run([sys.executable, "scripts/install.py", "--install-dir", str(root),
                          "--python", sys.executable, "--remote"], check=True)
          metadata = json.loads((root / "installation.json").read_text())
          launcher = metadata["launcher"]
          command = (["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", launcher]
                     if os.name == "nt" else [launcher])
          subprocess.run(command + ["doctor"], cwd=root, check=True)
          subprocess.run([metadata["python"], "scripts/verify_install.py",
                          str(root / "installation.json")], check=True)
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade 'pip>=26.2.1'
      - run: python -m pip install -e '.[dev,remote,secure,desktop]'
      - run: python -m ruff check --select E9,F63,F7,F82 src scripts tests
      - run: python -m mypy --strict --follow-imports=silent --ignore-missing-imports src/garmin_connect_mcp/launching.py src/garmin_connect_mcp/diagnostics.py
      - run: python scripts/check_docs.py
      - run: python scripts/check_secrets.py
      - run: python -m build
      - run: python -m pip_audit
  frozen:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/work/pyinstaller-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade 'pip>=26.2.1'
      - run: python -m pip install -e '.[dev,remote,secure,desktop,package]'
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb python3-tk
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m PyInstaller --noconfirm --distpath dist/frozen --workpath work/frozen scripts/garmin-connect.spec
      - if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --distpath dist/frozen --workpath work/frozen scripts/garmin-connect.spec
      - name: Verify executable and desktop construction
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          executable = pathlib.Path('dist/frozen/garmin-connect') / ('garmin-connect.exe' if os.name == 'nt' else 'garmin-connect')
          subprocess.run([sys.executable, 'scripts/verify_frozen.py', str(executable.absolute())], check=True, timeout=90)
          command = [str(executable.absolute()), 'desktop', '--smoke-test']
          subprocess.run(command if os.name == 'nt' else ['xvfb-run', '-a', *command], check=True, timeout=30)
      - name: Compile and verify unsigned test installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/setup_inno.ps1
          ./scripts/build_windows_installer.ps1 -Bundle dist/frozen/garmin-connect -Compiler $env:DAS_KREB_INNO -UnsignedTest
          $v = (Get-Content VERSION -Raw).Trim()
          ./scripts/verify_windows_installer.ps1 -Installer "dist/installer/garmin-connect-mcp-$v-windows-x64-setup.exe"
      - name: Record SHA256 checksums of unsigned test executables
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          bundle = pathlib.Path('dist/frozen/garmin-connect')
          output = bundle / 'SHA256SUMS'
          command = [sys.executable, 'scripts/executable_checksums.py', '--output', str(output), str(bundle)]
          if os.name == 'nt':
              version = pathlib.Path('VERSION').read_text(encoding='utf-8').strip()
              command.append(str(pathlib.Path('dist/installer') / f'garmin-connect-mcp-{version}-windows-x64-setup.exe'))
          subprocess.run(command, check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: garmin-connect-${{ runner.os }}-x64
          path: dist/frozen/garmin-connect
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: docker build -t garmin-connect-mcp:test .
      - run: python scripts/verify_docker.py garmin-connect-mcp:test
